<head>

<meta name="description" content="Кафе в браузере: готовьте, подавайте, зарабатывайте звёзды. A cozy cooking game in your browser.">

<meta property="og:title" content="Kitchen Quest">

<body>
<title>Kitchen Quest</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Rubik:wght@800;900&display=swap">
<style>
/* Оформление вокруг поля. Цвета — переменные: main.js заполняет их из theme.js, так что тема меняется в одном месте. */
:root {
  --ink: #4a2a12; --soft: #8a6a4a; --paper: #fff6e0; --page: #ffe3b0; --line: #e2c48f;
  --accent: #ff7a3d; --good: #4caf50; --bad: #e53935; --coin: #ffc928;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  background: radial-gradient(circle at 20% 10%, #fff1cf, var(--page) 60%, #f7cd8a);
  color: var(--ink); font: 700 16px/1.4 Nunito, "Segoe UI", system-ui, sans-serif;
  overscroll-behavior: none; touch-action: manipulation; user-select: none; -webkit-user-select: none;
}
#app { min-height: 100%; }
.screen { min-height: 100vh; padding: 20px 16px 40px; max-width: 980px; margin: 0 auto; }
#game { max-width: none; padding: 0; display: grid; place-items: center; min-height: 100vh; min-height: 100dvh; background: #2b1a0e; }
#board { display: block; touch-action: none; }
[hidden] { display: none !important; }

.title { text-align: center; margin: 6px 0 14px; }
.title h1 { margin: 0; font: 900 clamp(32px, 7vw, 54px)/1.05 Rubik, Nunito, sans-serif; color: var(--accent); text-shadow: 0 3px 0 #fff, 0 6px 0 rgba(74, 42, 18, 0.15); }
.title p { margin: 6px 0 0; color: var(--soft); }
.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; margin-bottom: 14px; }
.wallet, .stars-total { background: var(--paper); border: 3px solid var(--ink); border-radius: 999px; padding: 6px 16px; font-size: 20px; }
.btn {
  font: inherit; font-weight: 800; color: var(--ink); background: var(--paper); border: 3px solid var(--ink);
  border-radius: 16px; padding: 10px 18px; cursor: pointer; box-shadow: 0 4px 0 var(--ink); transition: transform .08s, box-shadow .08s;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.btn.primary { background: var(--accent); color: #fff; text-shadow: 0 1px 0 rgba(0, 0, 0, .25); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.note { background: #fff0ee; border: 2px solid var(--bad); color: #8e1b17; border-radius: 12px; padding: 8px 12px; margin: 8px 0; }

.chapter { margin: 0 0 22px; }
.chapter-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; margin: 0 2px 8px; }
.chapter-head h2 { margin: 0; font: 900 24px/1.1 Rubik, sans-serif; color: var(--ink); }
.chapter-head .blurb { color: var(--soft); font-size: 14px; flex: 1 1 100%; }
.chapter-head .chapter-stars { margin-left: auto; font-size: 18px; }
.chapter.locked { opacity: .55; filter: grayscale(.5); }
.free-play { margin-top: 10px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.free-play .best { color: var(--soft); font-size: 14px; }
.levels { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 14px; }
.card {
  position: relative; text-align: left; font: inherit; color: var(--ink); background: var(--paper); border: 3px solid var(--ink);
  border-radius: 20px; padding: 12px 14px 14px; cursor: pointer; box-shadow: 0 5px 0 var(--ink);
}
.card:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink); }
.card:disabled { opacity: .55; cursor: not-allowed; filter: grayscale(.6); }
.card .num { font: 900 30px/1 Rubik, sans-serif; color: var(--accent); }
.card .name { font-weight: 900; margin: 4px 0 2px; }
.card .goal, .card .fresh { color: var(--soft); font-size: 14px; }
.card .vip-tag { color: #b27a00; font-size: 13px; }
.card .stars { font-size: 22px; letter-spacing: 2px; margin-top: 6px; }
.card .lock { position: absolute; right: 12px; top: 10px; font-size: 22px; }

dialog { border: 4px solid var(--ink); border-radius: 24px; background: var(--paper); color: var(--ink); padding: 18px 22px; max-width: min(92vw, 520px); font: inherit; }
dialog::backdrop { background: rgba(43, 26, 14, .6); }
dialog[open] { display: flex; flex-direction: column; max-height: calc(100vh - 24px); max-height: calc(100dvh - 24px); }
dialog h3 { margin: 12px 0 2px; font: 900 18px/1.1 Rubik, sans-serif; }
dialog h2 { margin: 0 0 6px; font: 900 28px/1.1 Rubik, sans-serif; text-align: center; }
.big-stars { text-align: center; font-size: 54px; letter-spacing: 6px; margin: 4px 0; }
.facts { list-style: none; margin: 8px 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 4px 14px; color: var(--soft); }
#intro-text { white-space: pre-line; text-align: center; font-size: 19px; margin: 8px 0; }
#result-line { text-align: center; margin: 4px 0; font-size: 18px; }
.buttons { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 14px; }
.shop-list { display: grid; gap: 10px; margin-top: 10px; overflow: auto; min-height: 0; padding: 2px; }
.wallet-line { margin: 4px 0 0; text-align: center; font-size: 18px; }
.shop-item { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 10px 12px; border: 3px solid var(--line); border-radius: 16px; background: #fffaf0; }
.shop-item .what b { display: block; }
.shop-item .what span { color: var(--soft); font-size: 14px; }
.pips { letter-spacing: 3px; color: var(--accent); }

#toast {
  position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  background: rgba(74, 42, 18, .94); color: #fff6e0; padding: 10px 18px; border-radius: 16px; max-width: 90vw; text-align: center;
  transition: opacity .18s, transform .18s; z-index: 50;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }
/* Низкий экран — телефон на боку: окно шире и плотнее, список магазина прокручивается, кнопки остаются на виду. */
@media (max-height: 520px) {
  dialog { padding: 8px 16px; max-width: min(94vw, 720px); width: min(94vw, 720px); }
  dialog h2 { font-size: 20px; margin: 0; }
  .big-stars { font-size: 28px; margin: 0; letter-spacing: 3px; }
  #result-line, #intro-text { font-size: 15px; margin: 2px 0; }
  .facts { font-size: 13px; margin: 4px 0; gap: 0 14px; }
  .buttons { margin-top: 6px; gap: 8px; }
  .btn { padding: 6px 12px; font-size: 14px; box-shadow: 0 3px 0 var(--ink); }
  .shop-item { padding: 6px 10px; }
  .wallet-line { font-size: 15px; }
  .note { margin: 4px 0; padding: 4px 10px; font-size: 13px; }
}
</style>
<div id="app">
  <section id="menu" class="screen">
    <header class="title">
      <h1>Kitchen Quest</h1>
      <p>Кафе, где всё готовится вовремя</p>
    </header>
    <div class="bar">
      <span class="wallet">💰 <b id="wallet">0</b></span>
      <span class="stars-total">⭐ <b id="stars-total">0</b></span>
      <button id="open-shop" class="btn">🛒 Магазин</button>
      <button id="toggle-sound" class="btn" aria-label="Звуки">🔊</button>
    </div>
    <p id="storage-note" class="note" role="alert" hidden></p>
    <div id="chapters"></div>
  </section>

  <section id="game" class="screen" hidden>
    <canvas id="board" aria-label="Кафе"></canvas>
  </section>

  <dialog id="result">
    <h2 id="result-title"></h2>
    <div id="result-stars" class="big-stars" aria-hidden="true"></div>
    <p id="result-line"></p>
    <ul id="result-facts" class="facts"></ul>
    <p id="result-note" class="note" role="alert" hidden></p>
    <div class="buttons">
      <button id="result-next" class="btn primary">Дальше</button>
      <button id="result-again" class="btn">Ещё раз</button>
      <button id="result-shop" class="btn">🛒 Магазин</button>
      <button id="result-menu" class="btn">В меню</button>
    </div>
  </dialog>

  <dialog id="intro">
    <h2 id="intro-title"></h2>
    <p id="intro-text" class="lead"></p>
    <div class="buttons"><button id="intro-go" class="btn primary">Поехали!</button></div>
  </dialog>

  <dialog id="shop">
    <h2>Магазин</h2>
    <p class="wallet-line">У вас <b id="shop-wallet">0</b> 💰</p>
    <h3>Улучшения кухни</h3>
    <div id="shop-list" class="shop-list"></div>
    <h3>Усилители на смену</h3>
    <div id="shop-boosters" class="shop-list"></div>
    <p id="shop-note" class="note" role="alert" hidden></p>
    <div class="buttons"><button id="shop-close" class="btn primary">Готово</button></div>
  </dialog>

  <dialog id="pause">
    <h2>Пауза</h2>
    <div class="buttons">
      <button id="pause-resume" class="btn primary">Продолжить</button>
      <button id="pause-again" class="btn">Сначала</button>
      <button id="pause-menu" class="btn">В меню</button>
    </div>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>
</div>
